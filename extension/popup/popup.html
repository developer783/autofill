<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-2.33 4.67-3.5 7-3.5s7 1.17 7 3.5V19z"/>
        </svg>
        <span>Smart Autofill</span>
      </div>
      <button id="toggleSettingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main Tab View -->
    <main id="mainView" class="view">
      <div class="card">
        <label class="input-label">Select Candidate Profile</label>
        <select id="profileSelect" class="select-control">
          <option value="">Loading candidate profiles...</option>
        </select>
      </div>

      <button id="fillBtn" class="btn btn-primary btn-fill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Fill this page</span>
      </button>

      <!-- Notification Banner -->
      <div id="statusMessage" class="status-banner hidden"></div>

      <!-- Feedback Metrics Card -->
      <div id="metricsCard" class="card metrics-card hidden">
        <div class="metrics-header">
          <span class="metrics-title">Autofill Status</span>
          <span id="detectedAtsBadge" class="ats-badge">Generic ATS</span>
        </div>

        <div class="metrics-grid">
          <div class="metric-box success">
            <span id="statFilledCount" class="metric-num">0</span>
            <span class="metric-lbl">Fields Filled</span>
          </div>
          <div class="metric-box warning">
            <span id="statSkippedCount" class="metric-num">0</span>
            <span class="metric-lbl">Left Empty</span>
          </div>
          <div class="metric-box dim">
            <span id="statUnrecognizedCount" class="metric-num">0</span>
            <span class="metric-lbl">Skipped</span>
          </div>
        </div>

        <details class="details-accordion">
          <summary>View Field Breakdown Details</summary>
          <div id="breakdownList" class="breakdown-list"></div>
        </details>
      </div>
    </main>

    <!-- Settings View -->
    <main id="settingsView" class="view hidden">
      <div class="card">
        <h3 class="section-title">Extension Settings</h3>

        <div class="form-group">
          <label class="input-label">Server URL</label>
          <input type="text" id="serverUrlInput" class="input-control" placeholder="https://smart-autofill-api.onrender.com" />
        </div>

        <button id="saveSettingsBtn" class="btn btn-secondary">Save Settings</button>
        <button id="backToMainBtn" class="btn btn-text" style="margin-top: 8px">Back to Main</button>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
